services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: vyavas
      MYSQL_USER: vyavas
      MYSQL_PASSWORD: vyavas_local_password
      MYSQL_ROOT_PASSWORD: vyavas_local_root_password
    ports:
      - "3307:3306"
    volumes:
      - vyavas_mysql:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pvyavas_local_root_password"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  vyavas_mysql:
